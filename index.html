<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model — 70% Screen, Cursor Follow</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; background:#ffffff; }
    model-viewer {
      width:100%; height:100%; display:block; background:transparent;
      touch-action:none; cursor:default; /* обычный курсор */
    }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="./models/solution-logo.glb"
    camera-controls="false"
    disable-zoom
    disable-pan
    interaction-policy="none"

    environment-image="neutral"     <!-- нейтральное окружение -->
    environment-intensity="0.9"     <!-- чуть мягче -->
    exposure="1.0"
    tone-mapping="aces"
    shadow-intensity="0"            <!-- без тени -->
    dpr="1.25">

    <!-- Мягкое голубоватое освещение «в лоб» + лёгкий контровый для синевы по краям -->
    <directional-light color="#EAF3FF" intensity="1.0" direction="0 0 -1"></directional-light>
    <directional-light color="#D6E6FF" intensity="0.6" direction="-0.3 0.1 0.6"></directional-light>
  </model-viewer>

  <script>
    const mv = document.getElementById('mv');

    // Более синий холодный оттенок, умеренная металл. и чуть более матовый блеск
    mv.addEventListener('load', () => {
      const mats = mv.model?.materials || [];
      for (const mat of mats) {
        const pbr = mat.pbrMetallicRoughness;
        if (!pbr) continue;
        // Чуть синее, чем было: RGB близко к белому, но с усиленным B и немного пониженным R
        pbr.setBaseColorFactor([0.85, 0.92, 1.00, 1.0]);
        pbr.setMetallicFactor(0.4);
        pbr.setRoughnessFactor(0.28); // свет более рассеянный, блики мягче
      }
    });

    // Плавное следование камеры за курсором (без grab)
    (function(){
      const yawRange = Math.PI/6, pitchRange = Math.PI/12;
      const zoomFactor = 1.2;  // дальше от модели (визуально ~70% экрана)
      const k = 28, c = 10;

      function parseOrbit(str){
        const parts = String(str).trim().split(/\s+/);
        const num = p => {
          const m = p.match(/^(-?\d+(?:\.\d+)?)(deg|rad|m)$/i);
          const v = parseFloat(m[1]), u = m[2].toLowerCase();
          return u==='deg' ? v*Math.PI/180 : v;
        };
        return { theta:num(parts[0]), phi:num(parts[1]), radius:num(parts[2]) };
      }
      const fmt=(t,p,r)=>`${t}rad ${p}rad ${r}m`;
      const soft=x=>Math.tanh(x);

      let base={theta:0,phi:0,radius:1.2}, offs={yaw:0,pitch:0}, cur={yaw:0,pitch:0}, vel={yaw:0,pitch:0};
      let lastT=performance.now();

      function onPointer(x,y){
        const r=mv.getBoundingClientRect();
        const nx=(x-(r.left+r.width/2))/(r.width/2);
        const ny=(y-(r.top +r.height/2))/(r.height/2);
        offs.yaw =  soft(nx)*yawRange;
        offs.pitch=-soft(ny)*pitchRange;
      }

      mv.addEventListener('pointermove', e=>onPointer(e.clientX,e.clientY), {passive:true});
      mv.addEventListener('pointerleave', ()=>{offs.yaw=0; offs.pitch=0;}, {passive:true});
      mv.addEventListener('touchmove', e=>{ const t=e.touches[0]; if(t) onPointer(t.clientX,t.clientY); }, {passive:true});

      function tick(now){
        const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
        const ay=-k*(cur.yaw  -offs.yaw)  - c*vel.yaw;
        const ap=-k*(cur.pitch-offs.pitch)- c*vel.pitch;
        vel.yaw  += ay*dt; cur.yaw  += vel.yaw  *dt;
        vel.pitch+= ap*dt; cur.pitch+= vel.pitch*dt;
        mv.cameraOrbit = fmt(base.theta+cur.yaw, base.phi+cur.pitch, base.radius);
        requestAnimationFrame(tick);
      }

      mv.addEventListener('load', ()=>{
        const o=parseOrbit(mv.cameraOrbit||'0rad 0rad 1.2m');
        base.theta=o.theta; base.phi=o.phi; base.radius=o.radius*zoomFactor;
        mv.cameraOrbit = fmt(base.theta, base.phi, base.radius);
        lastT=performance.now(); requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
