<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model — 70% Screen, Cursor Follow</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      background: #ffffff; /* обычный белый фон страницы */
    }
    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;   /* без подложек */
      touch-action: none;        /* чтобы тач не скроллил страницу при движении */
    }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="./models/solution-logo.glb"
    camera-controls="false"     <!-- Никакого «грабинга» -->
    disable-zoom
    interaction-policy="none"

    /* Мягкий, студийный, рассеянный свет */
    environment-image="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr"
    environment-intensity="0.85"
    exposure="1.0"
    tone-mapping="aces"
    shadow-intensity="0.2"
    shadow-softness="1"
    dpr="1.25">
  </model-viewer>

  <script>
    const mv = document.getElementById('mv');

    /* Материал: почти белый с лёгким голубым, немного меньше «металла»,
       но блеск сохраняем за счёт невысокой шероховатости */
    mv.addEventListener('load', () => {
      const mats = mv.model?.materials || [];
      for (const mat of mats) {
        const pbr = mat.pbrMetallicRoughness;
        if (!pbr) continue;
        pbr.setBaseColorFactor([0.98, 0.99, 1.00, 1.0]); // белый с лёгким холодным оттенком
        pbr.setMetallicFactor(0.2);   // меньше «металла», светлее и нейтральнее блики
        pbr.setRoughnessFactor(0.20); // блеск остаётся, но не «зеркало»
      }
    });

    /* Камера следует за курсором (без удержания), объект ~70% экрана.
       Идеально точную «занимаемую площадь» без знания габаритов не измерить,
       поэтому используем коэффициент coverage≈0.7 и увеличиваем радиус. */
    (function(){
      const coverage = 0.70;             // целевое «занятие экрана»
      const yawRange   = Math.PI / 6;    // ~30° горизонт
      const pitchRange = Math.PI / 12;   // ~15° вертикаль
      const k = 24, c = 9;               // пружина для «silky» движения

      function parseOrbit(str){
        const parts = String(str).trim().split(/\s+/);
        const num = p => {
          const m = p.match(/^(-?\d+(?:\.\d+)?)(deg|rad|m)$/i);
          const v = parseFloat(m[1]), u = m[2].toLowerCase();
          return u==='deg' ? v*Math.PI/180 : v;
        };
        return { theta:num(parts[0]), phi:num(parts[1]), radius:num(parts[2]) };
      }
      const fmt  = (t,p,r)=>`${t}rad ${p}rad ${r}m`;
      const soft = x => Math.tanh(x);

      let base={theta:0,phi:0,radius:1.2},
          offs={yaw:0,pitch:0},
          cur ={yaw:0,pitch:0},
          vel ={yaw:0,pitch:0};
      let last = performance.now();

      function onPointer(x,y){
        const r = mv.getBoundingClientRect();
        const nx = (x - (r.left + r.width/2)) / (r.width/2);   // -1..1
        const ny = (y - (r.top  + r.height/2)) / (r.height/2); // -1..1
        offs.yaw   = soft(nx) * yawRange;
        offs.pitch = -soft(ny) * pitchRange;
      }

      // Движение курсора → камера следует (без перетаскивания)
      mv.addEventListener('pointermove', e => onPointer(e.clientX, e.clientY), { passive: true });
      mv.addEventListener('pointerleave', () => { offs.yaw = 0; offs.pitch = 0; }, { passive: true });
      mv.addEventListener('touchmove', e => {
        const t = e.touches[0]; if (t) onPointer(t.clientX, t.clientY);
      }, { passive: true });

      function tick(now){
        const dt = Math.min(0.05, (now - last)/1000); last = now;
        const ay = -k*(cur.yaw   - offs.yaw)   - c*vel.yaw;
        const ap = -k*(cur.pitch - offs.pitch) - c*vel.pitch;
        vel.yaw   += ay * dt; cur.yaw   += vel.yaw   * dt;
        vel.pitch += ap * dt; cur.pitch += vel.pitch * dt;
        mv.cameraOrbit = fmt(base.theta + cur.yaw, base.phi + cur.pitch, base.radius);
        requestAnimationFrame(tick);
      }

      mv.addEventListener('load', () => {
        // Берём исходную орбиту и «отъезжаем» так, чтобы объект занимал ~70%
        const o = parseOrbit(mv.cameraOrbit || '0rad 0rad 1.2m');
        base.theta  = o.theta;
        base.phi    = o.phi;
        // Чем меньше coverage — тем больше радиус (объект визуально меньше)
        // Примерно: radius ≈ base / coverage
        base.radius = o.radius / coverage;   // ~увеличиваем дистанцию
        mv.cameraOrbit = fmt(base.theta, base.phi, base.radius);
        last = performance.now();
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
