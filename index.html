<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model Demo</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { height:100%; margin:0; background:#ffffff; } /* нормальный фон страницы */
    .wrap{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:32px;
      box-sizing:border-box;
      background:#f5f7fa; /* мягкая светло-серая подложка */
    }
    .stage{
      width:min(520px, 80vw);   /* размер виджета (можно менять) */
      aspect-ratio:1/1;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 40px rgba(0,0,0,.08);
      background:#eaf4ff;       /* неброский голубоватый фон области модели */
    }
    model-viewer{
      width:100%;
      height:100%;
      display:block;
      background:transparent;   /* фон самой сцены — прозрачный, видна .stage */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <model-viewer id="mv"
        src="./models/solution-logo.glb"
        camera-controls="false"
        disable-zoom
        interaction-policy="none"

        /* студийное освещение и «нормальный» фон через HDR */
        environment-image="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr"
        skybox-image="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr"
        environment-intensity="1.2"
        exposure="1.1"
        tone-mapping="aces"

        shadow-intensity="0.35"
        shadow-softness="1"
        dpr="1.25"
      ></model-viewer>
    </div>
  </div>

  <script>
    // Плавное следование камеры за курсором: старт из исходной позы GLB
    (function(){
      const mv = document.getElementById('mv');

      const yawRange   = Math.PI/6;    // ~30° по горизонту
      const pitchRange = Math.PI/12;   // ~15° по вертикали
      const zoomFactor = 0.85;         // кадр чуть крупнее исходного
      const k = 28, c = 10;            // «пружина»/демпфирование

      function parseOrbit(str){
        const parts = String(str).trim().split(/\s+/);
        const num = p => {
          const m = p.match(/^(-?\d+(?:\.\d+)?)(deg|rad|m)$/i);
          const v = parseFloat(m[1]), u = m[2].toLowerCase();
          return u==='deg' ? v*Math.PI/180 : v;
        };
        return { theta:num(parts[0]), phi:num(parts[1]), radius:num(parts[2]) };
      }
      const fmt = (t,p,r)=>`${t}rad ${p}rad ${r}m`;
      const soft = x => Math.tanh(x);

      let base={theta:0,phi:0,radius:1.2}, offs={yaw:0,pitch:0}, cur={yaw:0,pitch:0}, vel={yaw:0,pitch:0};
      let last=performance.now();

      function onPointer(x,y){
        const r = mv.getBoundingClientRect();
        const nx = (x - (r.left + r.width/2)) / (r.width/2);
        const ny = (y - (r.top  + r.height/2)) / (r.height/2);
        offs.yaw   = soft(nx) * yawRange;
        offs.pitch = -soft(ny) * pitchRange;
      }
      mv.addEventListener('pointermove',e=>onPointer(e.clientX,e.clientY),{passive:true});
      mv.addEventListener('pointerleave',()=>{offs.yaw=0;offs.pitch=0;},{passive:true});
      mv.addEventListener('touchmove',e=>{const t=e.touches[0]; if(t) onPointer(t.clientX,t.clientY);},{passive:true});

      function tick(now){
        const dt = Math.min(0.05,(now-last)/1000); last=now;
        const ay = -k*(cur.yaw   - offs.yaw)   - c*vel.yaw;
        const ap = -k*(cur.pitch - offs.pitch) - c*vel.pitch;
        vel.yaw   += ay*dt; cur.yaw   += vel.yaw*dt;
        vel.pitch += ap*dt; cur.pitch += vel.pitch*dt;
        mv.cameraOrbit = fmt(base.theta+cur.yaw, base.phi+cur.pitch, base.radius);
        requestAnimationFrame(tick);
      }

      mv.addEventListener('load', ()=>{
        const o = parseOrbit(mv.cameraOrbit || '0rad 0rad 1.2m');
        base.theta=o.theta; base.phi=o.phi; base.radius=o.radius*zoomFactor;
        mv.cameraOrbit = fmt(base.theta, base.phi, base.radius);
        last=performance.now();
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
