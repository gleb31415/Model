<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model Demo</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html,body { height:100%; margin:0; }
    #wrap { height:100vh; width:100vw; background:#ffffff; }
    model-viewer { width:100%; height:100%; display:block; background:#ffffff; }
  </style>
</head>
<body>
  <div id="wrap">
    <model-viewer id="mv"
  src="./models/solution-logo.glb"
  camera-controls="false"
  disable-zoom
  interaction-policy="none"
  environment-image="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr"
  skybox-image="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr"
  environment-intensity="1.3"
  exposure="1.15"
  tone-mapping="aces"
  style="background:#ffffff;">
</model-viewer>

  </div>

  <script>
    // --- Гарантируем блеск на стороне клиента (на случай кривого экспорта) ---
    const mv = document.getElementById('mv');
    mv.addEventListener('load', () => {
      const materials = mv.model && mv.model.materials ? mv.model.materials : [];
      for (const mat of materials) {
        if (mat.pbrMetallicRoughness) {
          // Насильно делаем металл зеркальным и низкую шероховатость
          try {
            mat.pbrMetallicRoughness.setMetallicFactor(1.0);
            mat.pbrMetallicRoughness.setRoughnessFactor(0.1);
          } catch (e) { /* тихо игнорируем если материал без PBR */ }
        }
      }
    });

    // Плавное следование камеры за курсором (ваш код, слегка упорядочен):
    (function(){
      const yawRange   = Math.PI / 6;   // ~30°
      const pitchRange = Math.PI / 12;  // ~15°
      const zoomFactor = 0.8;
      const k = 28, c = 10;

      function parseOrbit(str){
        const parts = String(str).trim().split(/\s+/);
        const vals = parts.map(p=>{
          const m = p.match(/^(-?\d+(\.\d+)?)(deg|rad|m)$/i);
          if(!m) return null;
          const value = parseFloat(m[1]);
          const unit  = m[3].toLowerCase();
          if(unit === 'deg') return value * Math.PI/180;
          if(unit === 'rad') return value;
          if(unit === 'm')   return value;
          return null;
        });
        return { theta: vals[0]||0, phi: vals[1]||0, radius: vals[2]||1.2 };
      }
      function formatOrbit(theta, phi, radius){ return `${theta}rad ${phi}rad ${radius}m`; }
      function softClamp01(x){ return Math.tanh(x); }

      let base = { theta: 0, phi: 0, radius: 1.2 };
      let offs = { yaw: 0, pitch: 0 };
      let cur  = { yaw: 0, pitch: 0 };
      let vel  = { yaw: 0, pitch: 0 };
      let lastT = performance.now();

      function onPointer(x, y){
        const r = mv.getBoundingClientRect();
        const nx = (x - (r.left + r.width/2)) / (r.width/2);
        const ny = (y - (r.top  + r.height/2)) / (r.height/2);
        const sx = softClamp01(nx);
        const sy = softClamp01(ny);
        offs.yaw   = sx * yawRange;
        offs.pitch = -sy * pitchRange;
      }

      mv.addEventListener('pointermove', e=>onPointer(e.clientX, e.clientY), {passive:true});
      mv.addEventListener('pointerleave', ()=>{ offs.yaw = 0; offs.pitch = 0; }, {passive:true});
      mv.addEventListener('touchmove', e=>{
        const t = e.touches[0]; if (t) onPointer(t.clientX, t.clientY);
      }, {passive:true});

      function tick(now){
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        const ay = -k*(cur.yaw   - offs.yaw)   - c*vel.yaw;
        const ap = -k*(cur.pitch - offs.pitch) - c*vel.pitch;
        vel.yaw   += ay * dt;  cur.yaw   += vel.yaw * dt;
        vel.pitch += ap * dt;  cur.pitch += vel.pitch * dt;
        const theta = base.theta + cur.yaw;
        const phi   = base.phi   + cur.pitch;
        mv.cameraOrbit = formatOrbit(theta, phi, base.radius);
        requestAnimationFrame(tick);
      }

      mv.addEventListener('load', ()=>{
        const o = parseOrbit(mv.cameraOrbit || '0rad 0rad 1.2m');
        base.theta  = o.theta;
        base.phi    = o.phi;
        base.radius = o.radius * zoomFactor;
        mv.cameraOrbit = formatOrbit(base.theta, base.phi, base.radius);
        lastT = performance.now();
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
