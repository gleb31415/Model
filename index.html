<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model — Cool White/Blue Matte</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; background:#ffffff00; }
    model-viewer {
      width:100%; height:100%; display:block; background:transparent;
      touch-action:none; cursor:default;
    }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="./models/solution-logo.glb"
    camera-controls
    camera-target="auto"
    bounds="tight"
    environment-image="neutral"
    environment-intensity="1.6"
    exposure="1.55"
    tone-mapping="aces"
    shadow-intensity="0"
    dpr="1.25"
    field-of-view="68deg"
    min-field-of-view="40deg"
    max-field-of-view="90deg">

    <!-- Мягкое общее освещение (легко «выбеляет» материал) -->
    <hemisphere-light sky-color="#dbe8ff" ground-color="#ffffff" intensity="1.25"></hemisphere-light>

    <!-- Мягкий центральный белый спот: центр светлее -->
    <spot-light color="#ffffff" intensity="1.6"
                position="0 0 3"
                direction="0 0 -1"
                inner-cone-angle="28deg"
                outer-cone-angle="72deg"></spot-light>

    <!-- Голубые рим-лайты с двух сторон: синий контур по краям -->
    <directional-light color="#b8d2ff" intensity="1.0" direction="-0.9 0.1 -0.2"></directional-light>
    <directional-light color="#b8d2ff" intensity="1.0" direction="0.9 0.1 -0.2"></directional-light>

    <!-- Лёгкий холодный бэк-рим, подчёркивает край сверху -->
    <directional-light color="#a9c9ff" intensity="0.6" direction="0.0 0.6 0.9"></directional-light>
  </model-viewer>

  <script>
    const mv = document.getElementById('mv');

    // Материал: белый с лёгким голубым, менее металлический и менее блестящий
    mv.addEventListener('load', () => {
      const mats = mv.model?.materials || [];
      for (const mat of mats) {
        const pbr = mat.pbrMetallicRoughness; if (!pbr) continue;
        pbr.setBaseColorFactor([0.98, 0.99, 1.00, 1.0]); // очень светлый бело-голубой
        pbr.setMetallicFactor(0.18);                     // почти неметалл (как на фото)
        pbr.setRoughnessFactor(0.70);                    // матовый, без резких бликов
      }
    });

    // Автокадрирование + лёгкое приближение (чтобы "чуть меньше экрана")
    (function(){
      const yawRange   = Math.PI / 6;
      const pitchRange = Math.PI / 12;
      const k = 28, c = 10;
      const fmt = (t,p,r)=>`${t}rad ${p}rad ${r}m`;
      const soft = x => Math.tanh(x);

      let base = { theta:0, phi:0, radius:2.0 };
      let offs = { yaw:0, pitch:0 };
      let cur  = { yaw:0, pitch:0 };
      let vel  = { yaw:0, pitch:0 };
      let lastT = performance.now();

      function onPointer(x, y){
        const r = mv.getBoundingClientRect();
        const nx = (x - (r.left + r.width/2)) / (r.width/2);
        const ny = (y - (r.top  + r.height/2)) / (r.height/2);
        offs.yaw   =  soft(nx) * yawRange;
        offs.pitch = -soft(ny) * pitchRange;
      }
      mv.addEventListener('pointermove', e => onPointer(e.clientX, e.clientY), { passive:true });
      mv.addEventListener('pointerleave', () => { offs.yaw=0; offs.pitch=0; }, { passive:true });
      mv.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) onPointer(t.clientX, t.clientY); }, { passive:true });

      function tick(now){
        const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
        const ay = -k*(cur.yaw   - offs.yaw)   - c*vel.yaw;
        const ap = -k*(cur.pitch - offs.pitch) - c*vel.pitch;
        vel.yaw   += ay * dt; cur.yaw   += vel.yaw   * dt;
        vel.pitch += ap * dt; cur.pitch += vel.pitch * dt;
        mv.cameraOrbit = fmt(base.theta + cur.yaw, base.phi + cur.pitch, base.radius);
        requestAnimationFrame(tick);
      }

      function computeDistance(padding=1.12) {
        const dim = mv.getDimensions?.();
        if (!dim) return 3.0;

        // Описанная сфера для безопасного кадрирования
        const r = 0.5 * Math.hypot(dim.x, dim.y, dim.z);

        // Вертикальный FOV
        const fovDeg = parseFloat(String(mv.fieldOfView || '68deg').replace(/[^\d.]/g,''));
        const fov = fovDeg * Math.PI / 180;

        const dByHeight = r / Math.tan(Math.max(0.2, fov/2));
        const aspect = mv.clientWidth / Math.max(1, mv.clientHeight);
        const fovH = 2 * Math.atan(Math.tan(fov/2) * aspect);
        const dByWidth = r / Math.tan(Math.max(0.2, fovH/2));

        return Math.max(dByHeight, dByWidth) * padding;
      }

      mv.addEventListener('load', ()=>{
        const parts = String(mv.cameraOrbit || '0rad 0rad 1m').trim().split(/\s+/);
        const parse = (p)=> {
          const m = String(p).match(/^(-?\d+(?:\.\d+)?)(deg|rad|m)$/i);
          if(!m) return 0;
          const v = parseFloat(m[1]), u = m[2].toLowerCase();
          return u==='deg' ? v*Math.PI/180 : v;
        };
        base.theta  = parse(parts[0]);
        base.phi    = parse(parts[1]);

        // Базовая дистанция, чтобы точно влезало…
        const distFit = computeDistance(1.10);
        // …и чуть ближе (~8%), но всё ещё меньше экрана
        base.radius = distFit * 0.92;

        mv.cameraOrbit = fmt(base.theta, base.phi, base.radius);
        mv.jumpCameraToGoal?.();

        // Чуть ярче, если фон серый или сцена «съедает» свет
        mv.environmentIntensity = 1.8;
        mv.exposure = 1.6;

        lastT = performance.now();
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
