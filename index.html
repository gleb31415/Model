<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model — Fullscreen Mouse-Follow (Framed Like Reference)</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Полностью прозрачный фон страницы */
    html, body {
      height: 100%;
      margin: 0;
      background: transparent !important;
    }
    /* Единственный элемент — без обёрток и без каких-либо теней */
    model-viewer {
      position: fixed;
      inset: 0;                 /* на весь экран */
      width: 100vw;
      height: 100vh;
      display: block;
      background: transparent !important;
      box-shadow: none !important;
      filter: none !important;
      border: none !important;
      outline: none !important;
      touch-action: none;
      cursor: default;
      /* иногда браузерные стили рисуют «полосы» — обнулим */
      -webkit-tap-highlight-color: transparent;
    }
    /* скрываем внутренние служебные элементы, чтобы не казалось, что есть «вертикальный див» */
    model-viewer::part(poster),
    model-viewer::part(progress-bar),
    model-viewer::part(default-progress-bar),
    model-viewer::part(ar-button),
    model-viewer::part(ar-prompt) {
      display: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="./models/solution-logo.glb"
    bounds="tight"
    camera-target="auto"
    interaction-policy="none"
    disable-zoom
    environment-image="neutral"
    environment-intensity="2.0"
    exposure="1.45"
    tone-mapping="aces"
    shadow-intensity="0"
    dpr="1.25"
    field-of-view="65deg"
    style="--poster-color: transparent;">
    <!-- мягкий равномерный верх/низ, без направленных теней -->
    <hemisphere-light sky-color="#cfe1ff" ground-color="#ffffff" intensity="1.1"></hemisphere-light>
  </model-viewer>

  <script>
    const mv = document.getElementById('mv');

    // НЕ меняем ориентацию модели: используем ту, что «нормально стоит» в вашем референсе
    // Материалы НЕ трогаем, чтобы не сломать ваш цвет. (Если нужно — вернём настройку PBR отдельно.)

    (function(){
      // Диапазоны следования за мышью (деликатно)
      const yawRange   = Math.PI / 6;   // ~30°
      const pitchRange = Math.PI / 12;  // ~15°
      const k = 28, c = 10;             // критическое демпфирование
      const fmt = (t,p,r)=>`${t}rad ${p}rad ${r}m`;
      const soft = x => Math.tanh(x);

      let base = { theta:0, phi:0, radius:1.0 };
      let offs = { yaw:0, pitch:0 };
      let cur  = { yaw:0, pitch:0 };
      let vel  = { yaw:0, pitch:0 };
      let lastT = performance.now();

      function onPointer(x, y){
        const r = mv.getBoundingClientRect();
        const nx = (x - (r.left + r.width/2)) / (r.width/2);
        const ny = (y - (r.top  + r.height/2)) / (r.height/2);
        offs.yaw   =  soft(nx) * yawRange;
        offs.pitch = -soft(ny) * pitchRange;
      }

      mv.addEventListener('pointermove', e => onPointer(e.clientX, e.clientY), { passive:true });
      mv.addEventListener('pointerleave', () => { offs.yaw=0; offs.pitch=0; }, { passive:true });
      mv.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if (t) onPointer(t.clientX, t.clientY);
      }, { passive:true });

      function tick(now){
        const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
        const ay = -k*(cur.yaw   - offs.yaw)   - c*vel.yaw;
        const ap = -k*(cur.pitch - offs.pitch) - c*vel.pitch;
        vel.yaw   += ay * dt; cur.yaw   += vel.yaw   * dt;
        vel.pitch += ap * dt; cur.pitch += vel.pitch * dt;
        mv.cameraOrbit = fmt(base.theta + cur.yaw, base.phi + cur.pitch, base.radius);
        requestAnimationFrame(tick);
      }

      // Подгон расстояния под реальные габариты и FOV (как в вашем «нормально стоит»)
      function computeDistance(padding=1.12) {
        const dim = mv.getDimensions?.();
        if (!dim) return 1.2; // фоллбэк
        const r = 0.5 * Math.hypot(dim.x, dim.y, dim.z);               // сфера, описывающая модель
        const fovDeg = parseFloat(String(mv.fieldOfView || '65deg').replace(/[^\d.]/g,''));
        const fov = fovDeg * Math.PI / 180;
        const dByHeight = r / Math.tan(Math.max(0.2, fov/2));

        const aspect = mv.clientWidth / Math.max(1, mv.clientHeight);
        const fovH = 2 * Math.atan(Math.tan(fov/2) * aspect);
        const dByWidth = r / Math.tan(Math.max(0.2, fovH/2));

        return Math.max(dByHeight, dByWidth) * padding;
      }

      mv.addEventListener('load', () => {
        // Читаем текущий orbit как «референсную позу» (не трогаем ориентацию модели)
        const parts = String(mv.cameraOrbit || '0rad 0rad 2m').trim().split(/\s+/);
        const parse = (p)=> {
          const m = String(p).match(/^(-?\d+(?:\.\d+)?)(deg|rad|m)$/i);
          if(!m) return 0;
          const v = parseFloat(m[1]), u = m[2].toLowerCase();
          return u==='deg' ? v*Math.PI/180 : v;
        };
        base.theta = parse(parts[0]);
        base.phi   = parse(parts[1]);

        // Ставим дистанцию «как в референсе», но немного ближе, сохраняя целиком в кадре
        const fit  = computeDistance(1.10); // 1.10 — чуткий зазор
        base.radius = Math.max(0.15, fit * 0.95);

        // Фиксируем радиус (никакого зума и «дыхания» кадра)
        mv.setAttribute('min-camera-orbit', `auto auto ${base.radius}m`);
        mv.setAttribute('max-camera-orbit', `auto auto ${base.radius}m`);

        mv.cameraOrbit = fmt(base.theta, base.phi, base.radius);
        mv.jumpCameraToGoal?.();

        lastT = performance.now();
        requestAnimationFrame(tick);
      }, { once:true });
    })();
  </script>
</body>
</html>
