<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model Demo</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html,body { height:100%; margin:0; }
    #wrap { height:100vh; width:100vw; background:#ffffff; }
    model-viewer { width:100%; height:100%; display:block; background:#ffffff; }
  </style>
</head>
<body>
  <div id="wrap">
    <model-viewer id="mv"
      src="./models/solution-logo.glb"
      camera-controls="false"
      disable-zoom
      interaction-policy="none"
      style="background:#ffffff;">
    </model-viewer>
  </div>

  <script>
    // Cursor-follow rotation with fixed, large zoom
    (function(){
      const mv = document.getElementById('mv');
      let theta = 0, phi = 0, radius = 1.2;     // smaller radius => closer (bigger)
      const yawRange = Math.PI/6, pitchRange = Math.PI/12;
      let aimX = 0, aimY = 0, curX = 0, curY = 0, damping = 0.12;

      function applyOrbit(){ mv.cameraOrbit = `${theta}rad ${phi}rad ${radius}m`; }

      function onPointer(x, y){
        const r = mv.getBoundingClientRect();
        const nx = (x - (r.left + r.width/2)) / (r.width/2);
        const ny = (y - (r.top + r.height/2)) / (r.height/2);
        aimX = nx * yawRange;    // theta target
        aimY = -ny * pitchRange; // phi target
      }

      mv.addEventListener('pointermove', e => onPointer(e.clientX, e.clientY), {passive:true});
      mv.addEventListener('pointerleave', () => { aimX = 0; aimY = 0; }, {passive:true});
      mv.addEventListener('touchmove', e => { const t=e.touches[0]; if (t) onPointer(t.clientX, t.clientY); }, {passive:true});

      function loop(){
        requestAnimationFrame(loop);
        curX += (aimX - curX) * damping;
        curY += (aimY - curY) * damping;
        theta = curX; phi = curY;
        applyOrbit();
      }
      mv.addEventListener('load', () => { applyOrbit(); loop(); });
    })();
  </script>
</body>
</html>
